syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.WMCasinoService.Protos";

package gameinterfacewmcasinoservice;

// The greeting service definition.
service GameInterfaceWMCasinoService {
	// Sends a greeting
	rpc CreatePlayer (CreatePlayerRequest) returns (Reply);
	rpc FundIn (FundRequest) returns (FundReply);
	rpc FundOrder (FundOrderRequest) returns (FundOrderReply);
	rpc FundOut (FundRequest) returns (FundReply);
	rpc GetBalance (BalanceRequest) returns (BalanceReply);
	rpc GetAgentBalance (AgentBalanceRequest) returns (AgentBalanceReply);
	rpc KickPlayer (KickPlayerRequest) returns (Reply);
	rpc KickAllPlayer (KickAllPlayersRequest) returns (Reply);
	rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
	rpc GamePullRecord (GamePullRecordeRequest) returns (GamePullRecordReply);
	rpc GameUnsettle (GameUnsettleRequest) returns (GameUnsettleRecordReply);
	rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

message CreatePlayerRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	string user = 4;
	string password = 5;
	string user_name = 6;
}

message FundRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	string user = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundOrderRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	google.protobuf.Timestamp start_time = 4; 
    google.protobuf.Timestamp end_time = 5; 
	string user = 6;
	string transaction_id = 7;
	string game_provider_transaction_id = 8;
}

message BalanceRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	string user = 4;
}

message AgentBalanceRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;	
}

message KickPlayerRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	string user = 4;
}

message KickAllPlayersRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;	
}

message GameUrlRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	string user = 4;
	string password = 5;
	int32  language = 6;
}

message GamePullRecordeRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	google.protobuf.Timestamp start_time = 4; 
    google.protobuf.Timestamp end_time = 5;
}

message GameUnsettleRequest {
	string api_url = 1;
	string vendor_id = 2;
	string signature = 3;
	google.protobuf.Timestamp time = 4; 
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message Reply {
	bool success = 1;
}

message FundReply {
	bool success = 1;
	string message = 2;
	string game_provider_transaction_id = 3;	
	string transaction_id = 4;
	phoenix.protobuf.DecimalValue current_balance = 5;
}

message FundOrderReply {
	repeated FundOrder items = 1;
}

message FundOrder {
	string order_id = 1;
	google.protobuf.Timestamp add_time = 2;
	string mid = 3;
	phoenix.protobuf.DecimalValue money = 4;
	string op_code = 5;
	phoenix.protobuf.DecimalValue subtotal = 6;
	string order_num = 7;
	string user = 8;
}

message BalanceReply {
	bool success = 1;
	bool is_player_exist = 2;
	string message = 3;
	phoenix.protobuf.DecimalValue balance = 4;
}

message AgentBalanceReply {
	bool success = 1;	
	string message = 2;
	phoenix.protobuf.DecimalValue balance = 3;
}

message GameUrlReply {
	bool success = 1;
	bool is_player_exist = 2;
	string message = 3;
	string game_url = 4;
}

message GamePullRecordReply {
	repeated GamePullRecord items = 1;
}


message GamePullRecord {
	string user = 1;
	string bet_id = 2;
	google.protobuf.Timestamp bet_time = 3;
	phoenix.protobuf.DecimalValue before_cash = 4;
	phoenix.protobuf.DecimalValue bet = 5;
	phoenix.protobuf.DecimalValue validbet = 6;
	phoenix.protobuf.DecimalValue water = 7;
	phoenix.protobuf.DecimalValue result = 8;
	string bet_code = 9;
	phoenix.protobuf.DecimalValue waterbet = 10;
	phoenix.protobuf.DecimalValue winloss = 11;
	string ip = 12;
	string gid = 13;
	string event = 14;
	string event_child = 15;
	string round = 16;
	string subround = 17;
	string table_id = 18;
	string commission = 19;
	google.protobuf.Timestamp settime = 20;
	string reset = 21;
	string bet_result = 22;
	string game_result = 23;
	string gname = 24;
	string additional_data = 25;
}

message GameUnsettleRecordReply {
	repeated GameUnsettleRecord items = 1;
}

message GameUnsettleRecord {
	string user = 1;
	string bet_id = 2;
	string gid = 3;
	string event = 4;
	string event_child = 5;
	google.protobuf.Timestamp bet_time = 6;
	string bet_result = 7;
	phoenix.protobuf.DecimalValue bet = 8;
	string table_id = 9;
	string commission = 10;
	string round = 11;
	string subround = 12;
	string gname = 13;
	string additional_data = 14;
}

message CheckingServiceReply{
    string machine_name = 1;
}